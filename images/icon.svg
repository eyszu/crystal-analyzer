<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be9fd"/>
      <stop offset="1" stop-color="#4fb3e8"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fe0"/>
      <stop offset="1" stop-color="#2a3fa8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4fbf"/>
      <stop offset="1" stop-color="#1b2578"/>
    </linearGradient>
  </defs>

  <!-- cube faces (isometric) -->
  <polygon points="128,20 221,74 128,128 35,74" fill="url(#top)"/>
  <polygon points="35,74 128,128 128,236 35,182" fill="url(#left)"/>
  <polygon points="128,128 221,74 221,182 128,236" fill="url(#right)"/>

  <!-- edges -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round">
    <polygon points="128,20 221,74 221,182 128,236 35,182 35,74"/>
    <polyline points="35,74 128,128 221,74"/>
    <line x1="128" y1="128" x2="128" y2="236"/>
  </g>

  <!-- big C on the left face -->
  <g transform="translate(35,74) skewY(30)">
    <text x="46.5" y="88" text-anchor="middle" font-family="'DejaVu Sans', Verdana, Arial, sans-serif"
          font-size="96" font-weight="800" fill="#ffffff">C</text>
  </g>

  <!-- small a on the right face -->
  <g transform="translate(128,128) skewY(-30)">
    <text x="46.5" y="72" text-anchor="middle" font-family="'DejaVu Sans', Verdana, Arial, sans-serif"
          font-size="58" font-weight="800" fill="#bfe3ff">a</text>
  </g>
</svg>
